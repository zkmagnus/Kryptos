[package]
name = "runtime"
description = "The node daemon: event loop, miner, local RPC and command line"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "kryptos"
path = "src/main.rs"

[[bin]]
name = "wallet"
path = "src/bin/wallet_rpc.rs"

[[bin]]
name = "kryptoscan"
path = "src/bin/kryptoscan.rs"

[dependencies]
crypto.workspace = true
transaction-proof.workspace = true
protocol.workspace = true
storage.workspace = true
chain.workspace = true
p2p.workspace = true
wallet.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rand.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
subtle.workspace = true
zeroize.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tempfile.workspace = true

[dev-dependencies]
tracing.workspace = true
rand_chacha.workspace = true
p2p = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
