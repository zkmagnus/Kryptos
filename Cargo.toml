[workspace]
resolver = "2"
exclude = ["fuzz"]
members = [
    "crates/crypto",
    "crates/circuit",
    "crates/transaction-circuit",
    "crates/transaction-proof",
    "crates/protocol",
    "crates/chain",
    "crates/storage",
    "crates/p2p",
    "crates/wallet",
    "crates/runtime",
]

[patch.crates-io]
randomx-bindings-sys = { path = "vendor/randomx-bindings-sys" }

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
license = "GPL-3.0-or-later"

[workspace.dependencies]
# internal
crypto = { path = "crates/crypto" }
circuit = { path = "crates/circuit" }
transaction-circuit = { path = "crates/transaction-circuit" }
transaction-proof = { path = "crates/transaction-proof" }
protocol = { path = "crates/protocol" }
chain = { path = "crates/chain" }
storage = { path = "crates/storage" }
p2p = { path = "crates/p2p" }
wallet = { path = "crates/wallet" }

# cryptography
pasta_curves = "0.5"
ff = "0.13"
group = "0.13"
blake2b_simd = "1"
subtle = "2"
zeroize = { version = "1", features = ["derive"] }
rand_core = "0.6"
reddsa = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }
halo2_proofs = "0.3"
halo2_gadgets = "0.5"
halo2_poseidon = "0.1"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
chacha20 = { version = "0.9", default-features = false }
ml-kem = { version = "0.2.3", features = ["deterministic", "zeroize"] }

# errors and utilities
thiserror = "2"

# storage
redb = "4"
incrementalmerkletree = "0.8"

# chain
uint = "0.10"
randomx-bindings = "=0.1.4"

# runtime
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# networking
sha3 = "0.10"
data-encoding = "2"
arti-client = { version = "=0.48.0", default-features = false, features = ["tokio", "native-tls", "compression", "onion-service-client", "onion-service-service", "vanguards"] }
tor-hsservice = "=0.48.0"
tor-hscrypto = "=0.48.0"
tor-rtcompat = { version = "=0.48.0", features = ["tokio", "native-tls"] }
tor-cell = "=0.48.0"
tor-config = "=0.48.0"
tor-guardmgr = "=0.48.0"
tor-proto = "=0.48.0"
futures-util = { version = "0.3", features = ["std", "async-await"] }
fs-mistrust = "=0.16.1"
safelog = "=0.10.1"
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "process"] }

# testing
rand = "0.8"
rand_chacha = "0.3"
tempfile = "3"
proptest = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
# Fat LTO and one codegen unit trade longer clean builds for smaller/faster
# release code. Keep until runtime measurements justify a different balance.
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.test]
opt-level = 1
