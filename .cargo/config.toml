[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

[net]
offline = true

# Local release builds target the current machine. Set RUSTFLAGS explicitly to
# override this for portable or cross-compiled artifacts, for example:
# RUSTFLAGS="" cargo build --release --target aarch64-unknown-linux-gnu
[build]
rustflags = ["-C", "target-cpu=native"]
